<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenJev Playground</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5fd0; --accent-ink: #ffffff; --bar: #c9d6f5; --bar-win: #2f5fd0;
  --ok: #1f7a4d; --ok-bg: #e2f3ea; --bad: #b3261e; --bad-bg: #fbe5e3; --warn: #8a5a00;
  --code: #f0efea; --sel: #e8eefc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9a93; --line: #34342f;
    --accent: #7ea2ff; --accent-ink: #10131c; --bar: #2c3a5e; --bar-win: #7ea2ff;
    --ok: #6fd3a0; --ok-bg: #173327; --bad: #ff8a80; --bad-bg: #3a1c1a; --warn: #e6b450;
    --code: #262624; --sel: #26304a;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9a93; --line: #34342f;
  --accent: #7ea2ff; --accent-ink: #10131c; --bar: #2c3a5e; --bar-win: #7ea2ff;
  --ok: #6fd3a0; --ok-bg: #173327; --bad: #ff8a80; --bad-bg: #3a1c1a; --warn: #e6b450;
  --code: #262624; --sel: #26304a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
textarea, input, select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; min-width: 0; }
.status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.up { background: var(--ok); } .dot.down { background: var(--bad); }
.mode { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
.mode.debug { color: var(--bad); background: var(--bad-bg); } .mode.token { color: var(--ok); background: var(--ok-bg); }
.spacer { flex: 1; }
.layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 51px); }
aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
aside .tools { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
aside .row { display: flex; gap: 6px; }
aside .row button { flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; background: none; }
.tag.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#list { overflow: auto; flex: 1; }
.item { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.item:hover { background: var(--bg); }
.item.sel { background: var(--sel); }
.item .nm { flex: 1; min-width: 0; }
.item .sub { color: var(--muted); font-size: 11.5px; }
.mark { font-size: 11px; font-weight: 700; flex: none; }
.mark.ok { color: var(--ok); } .mark.bad { color: var(--bad); }
main { overflow: auto; padding: 18px 22px 60px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.meta { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.bar-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--code); color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; }
.pill.warn { color: var(--warn); }
.q { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.q + .q { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.q .edit { display: grid; gap: 8px; align-content: start; }
.q .head { display: grid; grid-template-columns: 120px 110px 1fr auto; gap: 6px; }
.res { font-size: 13px; align-self: start; }
.res.stale { opacity: .45; }
.res .empty { color: var(--muted); font-size: 12.5px; padding-top: 6px; }
.prob { display: grid; grid-template-columns: minmax(70px, 38%) 1fr 44px; gap: 8px; align-items: center; margin: 3px 0; }
.prob .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prob .lbl.win { font-weight: 700; }
.prob .track { height: 10px; background: var(--code); border-radius: 5px; overflow: hidden; }
.prob .fill { height: 100%; background: var(--bar); }
.prob .fill.win { background: var(--bar-win); }
.prob .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.verdict { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.verdict b { font-size: 15px; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; }
.badge.ok { color: var(--ok); background: var(--ok-bg); } .badge.bad { color: var(--bad); background: var(--bad-bg); }
.hint { color: var(--muted); font-size: 12px; }
.err { color: var(--bad); background: var(--bad-bg); padding: 8px 10px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
.stickybar { position: sticky; top: -18px; z-index: 2; background: var(--bg); padding: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stickybar .t { font-weight: 600; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover { background: var(--bg); }
.a { display: inline-block; margin: 0 10px 2px 0; }
.a.bad { color: var(--bad); font-weight: 600; } .a.ok { color: var(--ok); }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); width: min(820px, 94vw); padding: 16px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog textarea { height: 60vh; }
.toast { position: fixed; bottom: 16px; right: 16px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 14px 16px 60px; }
  .q, .meta { grid-template-columns: 1fr; }
  .q .head { grid-template-columns: 1fr 1fr; }
  header { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <h1>OpenJev Playground</h1>
  <div class="status" id="status"><span class="dot"></span><span>checking…</span></div>
  <span class="mode" id="mode" hidden></span>
  <div class="spacer"></div>
  <span class="hint" id="dir"></span>
</header>
<div class="layout">
  <aside>
    <div class="tools">
      <div class="row"><button class="primary" id="new">New</button><button id="runall" title="Run every sample in the list below">Run all</button></div>
      <input id="search" placeholder="Filter samples">
      <div class="tags" id="tagbar"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main><div class="wrap" id="main"></div></main>
</div>
<dialog id="jsondlg">
  <h2>Sample JSON <span class="pill">edit and apply, or paste one in</span></h2>
  <textarea id="jsontext" spellcheck="false"></textarea>
  <div class="err" id="jsonerr" hidden></div>
  <div class="bar-row" style="margin-top:10px"><div class="spacer"></div><button id="jsoncopy">Copy</button><button id="jsoncancel">Cancel</button><button class="primary" id="jsonapply">Apply</button></div>
</dialog>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TYPE_NAMES = { choice: "choice", noul: "yes / no", score: "score" };
const OPT_HINT = {
  choice: "One option per line. Optional description after a colon:\nbilling: charges, refunds, invoices\nshipping",
  score: "Levels, one per line, lowest first:\ncan wait\nthis week\ntoday\nright now",
  noul: "Optional, what each side means:\nyes: the customer is upset\nno: neutral or happy",
};

let samples = [], cur = null, curId = null, dirty = false, results = {}, lastRun = {}, tagFilter = null, view = "edit", evalRows = null;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Playground": "1" }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.reload(); throw new Error("signed out"); }   // token mode: back to the login form
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- model: question <-> editor text ---------- */
function optsToText(q) {
  const c = q.criteria;
  if (q.type === "score") return (c || []).join("\n");
  if (q.type === "noul") return c ? [c.true ? "yes: " + c.true : "", c.false ? "no: " + c.false : ""].filter(Boolean).join("\n") : "";
  return Object.entries(c || {}).map(([k, v]) => v ? `${k}: ${v}` : k).join("\n");
}
function textToCriteria(type, text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  if (type === "score") return lines;
  const split = l => { const m = l.match(/^([^:]+?)\s*:\s*(.*)$/); return m ? [m[1].trim(), m[2].trim() || null] : [l, null]; };
  if (type === "noul") {
    const c = {};
    for (const l of lines) { const [k, v] = split(l); if (/^(yes|true)$/i.test(k)) c.true = v; else if (/^(no|false)$/i.test(k)) c.false = v; }
    return (c.true || c.false) ? c : undefined;
  }
  return Object.fromEntries(lines.map(split));
}
function labels(q) { return q.type === "score" ? (q.criteria || []) : q.type === "choice" ? Object.keys(q.criteria || {}) : []; }
function parseState(text) {
  const t = text.trim();
  if (t.startsWith("{") || t.startsWith("[")) { try { return { value: JSON.parse(t), json: true }; } catch (e) { return { value: text, json: false, bad: e.message }; } }
  return { value: text, json: false };
}
function stateText(s) { return typeof s === "string" ? s : JSON.stringify(s, null, 2); }
function blank() {
  return { name: "", tags: [], notes: "", state: "", questions: { q1: { type: "choice", instructions: "", criteria: {} } }, expect: {} };
}
function nextQid(type) { const base = { choice: "pick", noul: "check", score: "rate" }[type]; let i = 1; while (cur.questions[base + (i > 1 ? i : "")]) i++; return base + (i > 1 ? i : ""); }

/* ---------- sidebar ---------- */
function renderList() {
  const q = $("#search").value.toLowerCase();
  const tags = [...new Set(samples.flatMap(s => s.tags || []))].sort();
  $("#tagbar").innerHTML = tags.map(t => `<button class="tag ${t === tagFilter ? "on" : ""}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  const shown = visibleSamples();
  $("#list").innerHTML = shown.map(s => {
    const r = lastRun[s.id];
    const mark = !r || !r.checked ? "" : r.passed === r.checked ? `<span class="mark ok">✓</span>` : `<span class="mark bad">${r.passed}/${r.checked}</span>`;
    return `<div class="item ${s.id === curId ? "sel" : ""}" data-id="${esc(s.id)}"><div class="nm">${esc(s.name)}<div class="sub">${esc(s.id)}${s.error ? " · " + esc(s.error) : ""}</div></div>${mark}</div>`;
  }).join("") || `<div class="item"><span class="hint">No samples${q || tagFilter ? " match" : ""}.</span></div>`;
}
function visibleSamples() {
  const q = $("#search").value.toLowerCase();
  return samples.filter(s => (!tagFilter || (s.tags || []).includes(tagFilter)) &&
    (!q || (s.name + " " + s.id + " " + (s.tags || []).join(" ")).toLowerCase().includes(q)));
}
$("#tagbar").onclick = e => { const t = e.target.dataset.t; if (t === undefined) return; tagFilter = tagFilter === t ? null : t; renderList(); };
$("#search").oninput = renderList;
$("#list").onclick = e => { const it = e.target.closest(".item[data-id]"); if (it) openSample(it.dataset.id); };
$("#new").onclick = () => { if (!confirmLeave()) return; cur = blank(); curId = null; results = {}; dirty = false; view = "edit"; render(); renderList(); $("#f-name").focus(); };

function confirmLeave() { return !dirty || confirm("Discard unsaved changes?"); }
function openSample(id) {
  if (id === curId && view === "edit") return;
  if (!confirmLeave()) return;
  const s = samples.find(x => x.id === id);
  if (s.error) { toast(s.error); return; }
  cur = structuredClone(s); delete cur.id; cur.expect ||= {}; cur.tags ||= [];
  curId = id; results = lastRun[id]?.answers || {}; dirty = false; view = "edit";
  render(); renderList();
}
async function reload() { samples = await api("GET", "/api/samples"); renderList(); }

/* ---------- editor ---------- */
function render() {
  if (view === "eval") return renderEval();
  if (!cur) { $("#main").innerHTML = `<div class="card hint">Pick a sample on the left, or press <b>New</b>.</div>`; return; }
  const st = parseState(stateText(cur.state));
  $("#main").innerHTML = `
    <div class="stickybar">
      <button class="primary" id="run" title="⌘↩">Run</button>
      <button id="save" title="⌘S">${curId ? "Save" : "Save as sample"}</button>
      ${curId ? `<button id="saveas">Save as new</button>` : ""}
      <button id="accept" ${Object.keys(results).length ? "" : "disabled"} title="Set each question's expected answer to the current result">Expect these answers</button>
      <button id="json">JSON</button>
      <div class="spacer"></div>
      <span class="t" id="dirtymark">${dirty ? "unsaved" : curId ? esc(curId) + ".json" : "new"}</span>
      ${curId ? `<button class="danger" id="del">Delete</button>` : ""}
    </div>
    <div id="runerr"></div>
    <div class="card meta">
      <label class="f">Name<input id="f-name" value="${esc(cur.name)}" placeholder="e.g. Ticket: double charge"></label>
      <label class="f">Tags (comma separated)<input id="f-tags" value="${esc((cur.tags || []).join(", "))}" placeholder="support, regression"></label>
      <label class="f" style="grid-column:1/-1">Notes<input id="f-notes" value="${esc(cur.notes || "")}" placeholder="What this case is checking"></label>
    </div>
    <div class="card">
      <h2>State <span class="pill ${st.bad ? "warn" : ""}" id="statekind">${st.json ? "JSON" : st.bad ? "text (JSON doesn't parse)" : "text"}</span><span class="spacer"></span><button id="fmt" style="text-transform:none;letter-spacing:0">Format JSON</button></h2>
      <textarea id="f-state" rows="9" spellcheck="false" placeholder="Text, or a JSON object such as {&quot;log_tail&quot;: &quot;...&quot;}">${esc(stateText(cur.state))}</textarea>
    </div>
    <div class="card">
      <h2>Questions <span class="spacer"></span>
        <button data-add="choice" style="text-transform:none;letter-spacing:0">+ choice</button>
        <button data-add="noul" style="text-transform:none;letter-spacing:0">+ yes / no</button>
        <button data-add="score" style="text-transform:none;letter-spacing:0">+ score</button></h2>
      <div id="qs">${Object.entries(cur.questions).map(([id, q]) => qHtml(id, q)).join("")}</div>
    </div>
    <div class="hint" id="runmeta"></div>`;
  wire();
}
function expectOptions(q, exp) {
  const opts = q.type === "noul" ? [["yes", true], ["no", false]] : labels(q).map(l => [l, l]);
  const cur = exp === undefined || exp === null ? "" : JSON.stringify(exp);
  let html = `<option value="">no expectation</option>` + opts.map(([t, v]) => `<option value="${esc(JSON.stringify(v))}" ${JSON.stringify(v) === cur ? "selected" : ""}>${esc(t)}</option>`).join("");
  if (Array.isArray(exp)) html += `<option value="${esc(cur)}" selected>any of: ${esc(exp.join(" | "))}</option>`;
  return html;
}
function qHtml(id, q) {
  return `<div class="q" data-q="${esc(id)}">
    <div class="edit">
      <div class="head">
        <input class="qid" value="${esc(id)}" title="Question id" spellcheck="false">
        <select class="qtype">${Object.entries(TYPE_NAMES).map(([k, v]) => `<option value="${k}" ${k === q.type ? "selected" : ""}>${v}</option>`).join("")}</select>
        <select class="qexp" title="Expected answer, checked on every run">${expectOptions(q, cur.expect?.[id])}</select>
        <button class="qdel danger" title="Remove question">✕</button>
      </div>
      <input class="qins" value="${esc(q.instructions)}" placeholder="The question, e.g. Which team should handle this?">
      <textarea class="qopts" rows="${Math.max(3, Math.min(8, labels(q).length + 1))}" spellcheck="false" placeholder="${esc(OPT_HINT[q.type])}">${esc(optsToText(q))}</textarea>
    </div>
    <div class="res">${resHtml(q, results[id])}</div>
  </div>`;
}
function resHtml(q, a) {
  if (!a) return `<div class="empty">Run to see the answer.</div>`;
  const badge = a.ok === true ? `<span class="badge ok">as expected</span>` : a.ok === false ? `<span class="badge bad">expected ${esc(fmtExp(a.expected))}</span>` : "";
  if (a.type === "noul") {
    const p = a.p ?? 0;
    return `<div class="verdict"><b>${p >= 0.5 ? "yes" : "no"}</b><span class="hint">p(yes) = ${p.toFixed(3)}</span>${badge}</div>` +
      bar("yes", p, p >= 0.5) + bar("no", 1 - p, p < 0.5);
  }
  const probs = a.probabilities || {};
  const order = labels(q).filter(l => l in probs).concat(Object.keys(probs).filter(l => !labels(q).includes(l)));
  const extra = a.type === "score" ? `expected level ${a.score?.toFixed(2)} · ` : "";
  return `<div class="verdict"><b>${esc(a.choice)}</b><span class="hint">${extra}confidence ${a.confidence?.toFixed(2)}</span>${badge}</div>` +
    order.map(l => bar(l, probs[l], l === a.choice)).join("");
}
function fmtExp(e) { return e === true ? "yes" : e === false ? "no" : Array.isArray(e) ? e.join(" | ") : e; }
function bar(label, p, win) {
  return `<div class="prob"><span class="lbl ${win ? "win" : ""}" title="${esc(label)}">${esc(label)}</span><div class="track"><div class="fill ${win ? "win" : ""}" style="width:${(p * 100).toFixed(1)}%"></div></div><span class="num">${(p * 100).toFixed(1)}%</span></div>`;
}

function markDirty() {
  dirty = true; $("#dirtymark").textContent = "unsaved";
  document.querySelectorAll(".res").forEach(r => r.classList.add("stale"));
}
function readQuestions() {
  const qs = {}, exp = {};
  for (const el of document.querySelectorAll(".q")) {
    const id = $(".qid", el).value.trim(), type = $(".qtype", el).value;
    const q = { type, instructions: $(".qins", el).value.trim() };
    const c = textToCriteria(type, $(".qopts", el).value);
    if (c !== undefined) q.criteria = c;
    if (qs[id]) throw new Error(`Two questions are called "${id}".`);
    qs[id] = q;
    const e = $(".qexp", el).value;
    if (e) exp[id] = JSON.parse(e);
  }
  return [qs, exp];
}
function collect() {
  const [qs, exp] = readQuestions();
  cur.name = $("#f-name").value.trim();
  cur.tags = $("#f-tags").value.split(",").map(t => t.trim()).filter(Boolean);
  cur.notes = $("#f-notes").value.trim();
  cur.state = parseState($("#f-state").value).value;
  cur.questions = qs; cur.expect = exp;
  return cur;
}
function wire() {
  const main = $("#main");
  main.oninput = e => {
    markDirty();
    if (e.target.id === "f-state") {
      const st = parseState(e.target.value), k = $("#statekind");
      k.textContent = st.json ? "JSON" : st.bad ? "text (JSON doesn't parse)" : "text"; k.classList.toggle("warn", !!st.bad);
    }
    if (e.target.classList.contains("qopts")) refreshExpect(e.target.closest(".q"));
  };
  main.onchange = e => {
    if (e.target.classList.contains("qtype")) {
      const el = e.target.closest(".q"), ta = $(".qopts", el);
      ta.placeholder = OPT_HINT[e.target.value];
      if (e.target.value === "noul" && ta.value && !/^(yes|no|true|false)\s*:/im.test(ta.value)) ta.value = "";
      refreshExpect(el);
    }
  };
  main.onclick = e => {
    const t = e.target;
    if (t.dataset.add) { collectSafe(); const id = nextQid(t.dataset.add); cur.questions[id] = { type: t.dataset.add, instructions: "" }; markDirtyRender(); $(`.q[data-q="${id}"] .qins`).focus(); }
    else if (t.classList.contains("qdel")) { if (document.querySelectorAll(".q").length === 1) return toast("A sample needs at least one question."); t.closest(".q").remove(); markDirty(); }
    else if (t.id === "run") run();
    else if (t.id === "save") save(false);
    else if (t.id === "saveas") save(true);
    else if (t.id === "del") del();
    else if (t.id === "accept") accept();
    else if (t.id === "json") openJson();
    else if (t.id === "fmt") { const st = parseState($("#f-state").value); if (st.json) { $("#f-state").value = JSON.stringify(st.value, null, 2); markDirty(); } else toast(st.bad ? "JSON error: " + st.bad : "State is plain text."); }
  };
}
function refreshExpect(el) {
  const type = $(".qtype", el).value, sel = $(".qexp", el), prev = sel.value;
  const q = { type, criteria: textToCriteria(type, $(".qopts", el).value) };
  sel.innerHTML = expectOptions(q, prev ? JSON.parse(prev) : undefined);
}
function collectSafe() { try { collect(); } catch (e) { } }
function markDirtyRender() { dirty = true; render(); }

async function run() {
  let s;
  try { s = collect(); } catch (e) { return showErr(e.message); }
  const btn = $("#run"); btn.disabled = true; btn.textContent = "Running…"; showErr("");
  try {
    const r = await api("POST", "/api/run", s);
    results = r.answers;
    if (curId && !dirty) { lastRun[curId] = r; renderList(); }
    render();
    $("#runmeta").textContent = `${r.elapsed_ms} ms · ${r.input_tokens} input tokens · ${r.model || "openjev"}` + (r.checked ? ` · ${r.passed}/${r.checked} as expected` : "");
  } catch (e) { showErr(e.message); }
  finally { const b = $("#run"); if (b) { b.disabled = false; b.textContent = "Run"; } }
}
function showErr(msg) { const el = $("#runerr"); if (el) el.innerHTML = msg ? `<div class="err">${esc(msg)}</div>` : ""; }
async function save(asNew) {
  let s;
  try { s = collect(); } catch (e) { return showErr(e.message); }
  try {
    const r = curId && !asNew ? await api("PUT", "/api/samples/" + curId, s) : await api("POST", "/api/samples", s);
    curId = r.id; dirty = false; await reload(); render(); renderList(); toast(`Saved ${r.id}.json`);
  } catch (e) { showErr(e.message); }
}
async function del() {
  if (!confirm(`Delete ${curId}.json?`)) return;
  await api("DELETE", "/api/samples/" + curId);
  delete lastRun[curId]; cur = null; curId = null; dirty = false; results = {};
  await reload(); render();
}
function accept() {
  collectSafe();
  for (const [id, a] of Object.entries(results)) {
    if (!cur.questions[id]) continue;
    cur.expect[id] = a.type === "noul" ? a.p >= 0.5 : a.choice;
  }
  dirty = true; render(); toast("Expected answers set; Save to keep them.");
}

/* ---------- JSON dialog ---------- */
function openJson() {
  collectSafe();
  $("#jsontext").value = JSON.stringify(cur, null, 2); $("#jsonerr").hidden = true; $("#jsondlg").showModal();
}
$("#jsoncancel").onclick = () => $("#jsondlg").close();
$("#jsoncopy").onclick = () => { navigator.clipboard.writeText($("#jsontext").value).then(() => toast("Copied")); };
$("#jsonapply").onclick = () => {
  try {
    const s = JSON.parse($("#jsontext").value);
    if (typeof s !== "object" || !s.questions) throw new Error("Needs at least \"state\" and \"questions\".");
    delete s.id; s.expect ||= {}; s.tags ||= []; s.name ||= cur.name;
    cur = s; dirty = true; $("#jsondlg").close(); render();
  } catch (e) { $("#jsonerr").textContent = e.message; $("#jsonerr").hidden = false; }
};

/* ---------- run all ---------- */
$("#runall").onclick = async () => {
  if (view === "edit" && !confirmLeave()) return;
  const list = visibleSamples().filter(s => !s.error);
  if (!list.length) return;
  view = "eval"; dirty = false; evalRows = list.map(s => ({ s, r: null, err: null })); renderEval();
  $("#runall").disabled = true;
  for (const row of evalRows) {
    if (view !== "eval") break;
    try { row.r = await api("POST", "/api/run", row.s); lastRun[row.s.id] = row.r; }
    catch (e) { row.err = e.message; }
    renderEval(); renderList();
  }
  $("#runall").disabled = false;
};
function renderEval() {
  const done = evalRows.filter(r => r.r || r.err);
  const passed = done.reduce((n, r) => n + (r.r?.passed || 0), 0), checked = done.reduce((n, r) => n + (r.r?.checked || 0), 0);
  const ms = done.reduce((n, r) => n + (r.r?.elapsed_ms || 0), 0);
  const failing = done.filter(r => r.err || (r.r && r.r.passed < r.r.checked)).length;
  $("#main").innerHTML = `
    <div class="stickybar"><span class="t">Run all: ${done.length}/${evalRows.length} samples · ${passed}/${checked} expected answers matched · ${failing} sample${failing === 1 ? "" : "s"} with misses · ${(ms / 1000).toFixed(1)} s</span></div>
    <div class="card"><table>
      <thead><tr><th>Sample</th><th>Answers</th><th style="text-align:right">ms</th></tr></thead>
      <tbody>${evalRows.map(({ s, r, err }) => `<tr class="click" data-id="${esc(s.id)}">
        <td>${r ? (r.passed === r.checked ? (r.checked ? `<span class="mark ok">✓</span> ` : "") : `<span class="mark bad">✗</span> `) : ""}${esc(s.name)}<div class="hint">${esc(s.id)}</div></td>
        <td>${err ? `<span class="a bad">${esc(err)}</span>` : r ? Object.entries(r.answers).map(([id, a]) =>
          `<span class="a ${a.ok === false ? "bad" : a.ok ? "ok" : ""}">${esc(id)}=${esc(short(a))}${a.ok === false ? " (want " + esc(fmtExp(a.expected)) + ")" : ""}</span>`).join("") : `<span class="hint">${done.length < evalRows.length ? "…" : ""}</span>`}</td>
        <td class="num">${r ? r.elapsed_ms : ""}</td></tr>`).join("")}</tbody></table></div>`;
  $("#main").onclick = e => { const tr = e.target.closest("tr[data-id]"); if (tr) { view = "edit"; curId = null; openSample(tr.dataset.id); } };
  $("#main").oninput = $("#main").onchange = null;
}
function short(a) { return a.type === "noul" ? (a.p >= 0.5 ? "yes" : "no") + " " + a.p.toFixed(2) : `${a.choice} ${a.confidence?.toFixed(2)}`; }

/* ---------- status, keys, boot ---------- */
async function status() {
  try {
    const s = await api("GET", "/api/status");
    const v = s.version || {};
    $("#status").innerHTML = `<span class="dot ${s.ok ? "up" : "down"}"></span><span title="${esc(s.error || JSON.stringify(v))}">${s.ok ? esc(v.model_dir || v.model || "OpenJev") + " · " + esc(s.url) : "OpenJev not reachable at " + esc(s.url) + " — scripts/serve.sh start"}</span>`;
    $("#dir").textContent = "samples: " + s.samples;
    const m = $("#mode"), modes = { debug: ["debug: no token", "Anyone who can reach this port can use this playground"], token: ["token", "Network access with a token"] };
    m.hidden = !modes[s.auth];
    if (modes[s.auth]) { m.className = "mode " + s.auth; [m.textContent, m.title] = modes[s.auth]; }
  } catch (e) { $("#status").innerHTML = `<span class="dot down"></span><span>playground server stopped</span>`; }
}
document.addEventListener("keydown", e => {
  if (!(e.metaKey || e.ctrlKey) || view !== "edit" || !cur) return;
  if (e.key === "Enter") { e.preventDefault(); run(); }
  if (e.key === "s") { e.preventDefault(); save(false); }
});
window.addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });
status(); setInterval(status, 15000);
reload().then(render);
</script>
</body>
</html>
