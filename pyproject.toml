[project]
name = "openjev-client"
version = "0.1.0"
description = "Small stdlib-only client for a local OpenJev decision API (/v1/systemone)"
requires-python = ">=3.9"
license = "Apache-2.0"

[project.scripts]
openjev = "openjev_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openjev_client"]

[tool.setuptools.package-data]
openjev_client = ["playground.html"]
